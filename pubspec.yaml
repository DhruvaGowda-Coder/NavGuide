name: navguide
description: NavGuide — Smart navigation, train tracking, hazard alerts & travel unions for India.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  sensors_plus: ^7.1.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/navguide_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/navguide_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/navguide_icon.png"
  min_sdk_android: 21
